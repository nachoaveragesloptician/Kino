<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100" width="100%" height="100%">
  <defs>
    <linearGradient id="kGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d59a1" />
      <stop offset="100%" stop-color="#7aa2f7" />
    </linearGradient>
    
    <linearGradient id="playGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7aa2f7" />
      <stop offset="100%" stop-color="#f7768e" />
    </linearGradient>
  </defs>

  <!-- Move EVERYTHING right -->
  <g transform="translate(45,0)">

    <!-- K -->
    <path
      d="
        M 30 20
        L 30 80
        M 30 50
        L 65 20
        M 30 50
        L 65 80
      "
      stroke="url(#kGrad)"
      stroke-width="14"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />

    <!-- Play button -->
    <path 
      d="M 60 50 L 90 30 L 90 70 Z"
      fill="url(#playGrad)"
      stroke="url(#playGrad)"
      stroke-width="4"
      stroke-linejoin="round"
    />

  </g>
</svg>